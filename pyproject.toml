[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-tray"
version = "0.1.0"
description = "Linux tray notifications for Gmail and Zoho Mail"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "keyring>=25"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
mail-tray = "mailtray.__main__:main"

[tool.setuptools.packages.find]
include = ["mailtray*"]

[tool.setuptools.package-data]
mailtray = ["icons/*.png", "setup.html"]
